name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: Android projesini oluştur
        run: |
          npx cap add android
          python3 scripts/patch-android.py
          npx cap sync android

      - name: Lisansları kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hatirla-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Hatirla.apk
          gh release delete apk-son -y --cleanup-tag || true
          gh release create apk-son Hatirla.apk --title "Hatırla APK" --notes "Son derleme: ${{ github.sha }}"
